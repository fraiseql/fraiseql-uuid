# fraiseql-uuid - Structured UUID Pattern Library

[project]
name = "fraiseql-uuid"
version = "0.1.3"
description = "Structured UUID pattern library with encode/decode support"
authors = [
    {name = "Lionel Hamayon", email = "lionel.hamayon@evolution-digitale.fr"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["uuid", "pattern", "encoding", "database", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]

# Package dependencies
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/fraiseql/fraiseql-uuid"
Repository = "https://github.com/fraiseql/fraiseql-uuid"
"Bug Tracker" = "https://github.com/fraiseql/fraiseql-uuid/issues"

[project.scripts]
fraiseql-uuid = "fraiseql_uuid.cli.main:cli [cli]"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraiseql_uuid"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "ty>=0.0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "ERA", "PL", "RUF", "PERF", "FURB"]
ignore = [
    "PLC0415",  # import-outside-top-level — lazy imports are intentional (optional deps, CLI)
    "PLR0912",  # too-many-branches — CLI handlers are naturally branchy
    "PLR0913",  # too-many-arguments — Click commands have many parameters by design
    "PLR0915",  # too-many-statements — CLI handlers are naturally long
    "PLR0917",  # too-many-positional-arguments — Click passes every option as one
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
